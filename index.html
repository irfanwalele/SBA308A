<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Finder</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <header>
    <h1>Product Finder</h1>
    <p>Search for products or add a new product.</p>
  </header>

  <main>
    <section>
      <h2>Search Products</h2>

      <form id="search-form">
        <label for="search-input">Product name:</label>
        <input
          type="text"
          id="search-input"
          placeholder="Example: phone"
          required
        >
        <button type="submit">Search</button>
      </form>

      <button id="show-all-button" type="button">
        Show All Products
      </button>
    </section>

    <p id="message"></p>

    <section>
      <h2>Products</h2>
      <div id="product-container"></div>
    </section>

    <section>
      <h2>Add a Product</h2>

      <form id="add-product-form">
        <label for="product-title">Product title:</label>
        <input type="text" id="product-title" required>

        <label for="product-price">Price:</label>
        <input
          type="number"
          id="product-price"
          min="0"
          step="0.01"
          required
        >

        <label for="product-description">Description:</label>
        <textarea id="product-description" required></textarea>

        <button type="submit">Add Product</button>
      </form>
    </section>
  </main>

  <footer>
    <p>SBA 308A JavaScript Web Application</p>
  </footer>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
