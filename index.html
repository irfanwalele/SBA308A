<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cat Breed Explorer</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <header>
    <h1>Cat Breed Explorer</h1>
    <p>Choose a breed to discover cats and save your favorites.</p>
  </header>

  <main>
    <section>
      <h2>Find Cats</h2>

      <form id="breed-form">
        <label for="breed-select">Select a cat breed:</label>

        <select id="breed-select" required>
          <option value="">Choose a breed</option>
        </select>

        <button type="submit">Search</button>
      </form>
    </section>

    <p id="message"></p>

    <section>
      <h2>Cat Results</h2>

      <div id="cat-container"></div>
    </section>
  </main>

  <footer>
    <p>Irfan SBA 308A </p>
  </footer>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
